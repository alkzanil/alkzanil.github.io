# Site settings
title: "Alka's Portfolio"
description: "Welcome to my portfolio!"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Alka Anil"
resume_title:                   "AI/ML Engineer | Data Engineer | Cloud & Big Data Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "alka.anil098@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
#resume_contact_telephone:       "555-7334"
resume_contact_address:         "London, United Kingdom"

resume_header_contact_info:     "London, United Kingdom • alka.anil098@gmail.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>AI/ML Engineer | Data Engineer | Cloud & Big Data Enthusiast with a Master’s in AI and a Bachelor’s in Computer Science (Cloud & Big Data), I specialize in machine learning, data engineering, and cloud solutions. Passionate about building scalable AI-driven applications, I’m seeking opportunities in AI/ML, data engineering, or cloud-based AI roles. Let’s connect! </p>"
# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
